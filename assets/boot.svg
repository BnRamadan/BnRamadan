<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 286" width="1200" height="286" role="img" aria-label="A terminal boots the profile: 18+ live projects, 6 countries, 17+ languages, 10,000+ hours, ready."><title>A terminal boots the profile: 18+ live projects, 6 countries, 17+ languages, 10,000+ hours, ready.</title><style>.bg{fill:#04060A}.bar{fill:#0A111F}.d1{fill:#E23670}.d2{fill:#E8912B}.d3{fill:#2EB88A}.ln{font:400 20px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace;fill:#DEDEDE;white-space:pre}.ok{fill:#00B4EF}.pr{fill:#AECAEA}.ty{animation:type .9s steps(28,end) backwards}.cur{fill:#AECAEA;animation:blink 1s steps(2,start) infinite}@keyframes type{from{clip-path:inset(0 100% 0 0)}}@keyframes blink{to{visibility:hidden}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect class="bg" width="1200" height="286" rx="20"/><rect class="bar" width="1200" height="38" rx="20"/><rect class="bar" y="20" width="1200" height="18"/><circle class="d1" cx="30" cy="19" r="6"/><circle class="d2" cx="50" cy="19" r="6"/><circle class="d3" cx="70" cy="19" r="6"/><text x="34" y="82" class="ln ty" style="animation-delay:0.35s"><tspan class="pr">$</tspan> boot bnramadan --mode=production</text><text x="34" y="118" class="ln ty" style="animation-delay:1.05s">loading 18+ live projects ........<tspan class="ok"> ok</tspan></text><text x="34" y="154" class="ln ty" style="animation-delay:1.75s">mapping 6 countries ..............<tspan class="ok"> ok</tspan></text><text x="34" y="190" class="ln ty" style="animation-delay:2.45s">warming up 17+ languages .........<tspan class="ok"> ok</tspan></text><text x="34" y="226" class="ln ty" style="animation-delay:3.15s">replaying 10,000+ hours ..........<tspan class="ok"> ok</tspan></text><text x="34" y="262" class="ln ty" style="animation-delay:3.85s">ready. press start</text><rect class="cur" x="256" y="246" width="11" height="20"/></svg>